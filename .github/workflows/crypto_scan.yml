name: Crypto Quant Scan

on:
  schedule:
    - cron: '0 * * * *'    # Trigger once per hour; loop runs every ~60s internally
  workflow_dispatch:         # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 58     # Safety: kill before next hourly trigger

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0   # full history needed for rebase

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Configure git
      run: |
        git config --global user.email "quant-bot@github.com"
        git config --global user.name "Quant Bot"

    - name: Run 1-minute scan loop (55 iterations ≈ 55 min)
      run: |
        # One-time prune: remove any MONITORING tier signals from previous runs
        python signal_accuracy_tracker.py --prune || true

        for i in $(seq 1 55); do
          echo "=== Scan $i/55 at $(date -u '+%H:%M:%S UTC') ==="
          START_TIME=$(date +%s)

          python signal_accuracy_tracker.py --once

          ELAPSED=$(( $(date +%s) - START_TIME ))
          REMAINING=$(( 60 - ELAPSED ))
          [ $REMAINING -gt 5 ] && sleep $REMAINING

          # Commit + push every 5 scans (every ~5 min) and on final scan
          if [ $(( i % 5 )) -eq 0 ] || [ $i -eq 55 ]; then
            python generate_dashboard.py
            git add accuracy_db/ docs/
            if ! git diff --staged --quiet; then
              git commit -m "Scans up to $(date -u '+%Y-%m-%d %H:%M UTC') [scan $i/55]"
              # Pull remote changes first (ours=local for binary DBs), then push
              git pull --no-rebase -X ours origin main || true
              git push origin HEAD:main
            fi
          fi
        done
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
