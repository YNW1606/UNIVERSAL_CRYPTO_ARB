name: Crypto Quant Scan

on:
  schedule:
    - cron: '0 * * * *'    # Safety net: fires hourly if self-trigger chain breaks
  workflow_dispatch:         # Manual trigger from GitHub UI

permissions:
  contents: write
  actions: write             # Needed for self-trigger (workflow_dispatch API)

# Only one scan job at a time — prevents concurrent SQLite writes / DB corruption
concurrency:
  group: crypto-scan-singleton
  cancel-in-progress: false   # Queue rather than cancel; chain stays intact

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 56       # Leave 2 min headroom for self-trigger step

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Configure git
      run: |
        git config --global user.email "quant-bot@github.com"
        git config --global user.name "Quant Bot"

    - name: Run 1-minute scan loop (50 iterations ≈ 50 min)
      run: |
        # Prune sub-threshold signals (score < MIN_SCORE=50) + stale PENDING at job start
        python signal_accuracy_tracker.py --prune || true

        for i in $(seq 1 50); do
          echo "=== Scan $i/50 at $(date -u '+%H:%M:%S UTC') ==="
          START_TIME=$(date +%s)

          python signal_accuracy_tracker.py --once

          ELAPSED=$(( $(date +%s) - START_TIME ))
          REMAINING=$(( 60 - ELAPSED ))
          [ $REMAINING -gt 5 ] && sleep $REMAINING

          # Commit + push every 5 scans (~5 min) and on final scan
          if [ $(( i % 5 )) -eq 0 ] || [ $i -eq 50 ]; then
            # Save scan data before resetting to latest remote code
            mkdir -p /tmp/scan_backup
            cp accuracy_db/signals.db        /tmp/scan_backup/ 2>/dev/null || true
            cp accuracy_db/latest_scan.json  /tmp/scan_backup/ 2>/dev/null || true
            cp accuracy_db/perp_arb.json     /tmp/scan_backup/ 2>/dev/null || true
            cp accuracy_db/perp_arb.db       /tmp/scan_backup/ 2>/dev/null || true
            cp accuracy_db/signals_history.json /tmp/scan_backup/ 2>/dev/null || true

            # Hard-reset to latest remote so Python code is always up to date
            # This prevents the runner from reverting code pushes we make from local
            git fetch origin main
            git reset --hard origin/main

            # Smart DB merge: keep whichever DB has MORE records (pushed local DB beats stale runner DB)
            BACKUP_TRADES=$(python3 -c "
import sqlite3
try:
    c=sqlite3.connect('/tmp/scan_backup/perp_arb.db')
    print(c.execute('SELECT COUNT(*) FROM trades').fetchone()[0])
except: print(0)
" 2>/dev/null || echo 0)
            GIT_TRADES=$(python3 -c "
import sqlite3
try:
    c=sqlite3.connect('accuracy_db/perp_arb.db')
    print(c.execute('SELECT COUNT(*) FROM trades').fetchone()[0])
except: print(0)
" 2>/dev/null || echo 0)
            echo "DB merge: backup=${BACKUP_TRADES} trades, git=${GIT_TRADES} trades"
            if [ "${BACKUP_TRADES}" -gt "${GIT_TRADES}" ]; then
              echo "→ Using backup perp_arb.db (${BACKUP_TRADES} > ${GIT_TRADES})"
              cp /tmp/scan_backup/perp_arb.db accuracy_db/
            else
              echo "→ Using git perp_arb.db (${GIT_TRADES} >= ${BACKUP_TRADES})"
              cp accuracy_db/perp_arb.db /tmp/scan_backup/perp_arb.db
            fi

            BACKUP_SIGS=$(python3 -c "
import sqlite3
try:
    c=sqlite3.connect('/tmp/scan_backup/signals.db')
    print(c.execute('SELECT COUNT(*) FROM signals').fetchone()[0])
except: print(0)
" 2>/dev/null || echo 0)
            GIT_SIGS=$(python3 -c "
import sqlite3
try:
    c=sqlite3.connect('accuracy_db/signals.db')
    print(c.execute('SELECT COUNT(*) FROM signals').fetchone()[0])
except: print(0)
" 2>/dev/null || echo 0)
            echo "Signal DB merge: backup=${BACKUP_SIGS} sigs, git=${GIT_SIGS} sigs"
            if [ "${BACKUP_SIGS}" -gt "${GIT_SIGS}" ]; then
              echo "→ Using backup signals.db"
              cp /tmp/scan_backup/signals.db accuracy_db/
            else
              echo "→ Using git signals.db"
              cp accuracy_db/signals.db /tmp/scan_backup/signals.db
            fi

            cp /tmp/scan_backup/latest_scan.json    accuracy_db/ 2>/dev/null || true
            cp /tmp/scan_backup/perp_arb.json       accuracy_db/ 2>/dev/null || true
            cp /tmp/scan_backup/signals_history.json accuracy_db/ 2>/dev/null || true

            # Prune sub-threshold signals after every restore so old noise never comes back
            python signal_accuracy_tracker.py --prune || true

            # Run one perp arb cycle: update positions, apply funding, open/close trades
            rm -f accuracy_db/perp_arb.lock   # clear stale lock from any previous killed runner
            python perp_arb_paper.py --once || true

            # Regenerate dashboard with latest code + fresh scan data
            python generate_dashboard.py

            git add accuracy_db/ docs/
            if ! git diff --staged --quiet; then
              git commit -m "Scans up to $(date -u '+%Y-%m-%d %H:%M UTC') [scan $i/50]"
              git push origin HEAD:main
            fi
          fi
        done
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ── SELF-TRIGGER: immediately queue the next run so scanning is continuous ──
    # This ensures data updates every ~50 min regardless of GitHub cron reliability.
    # Concurrency group above guarantees only one job runs at a time (no DB corruption).
    - name: Queue next scan run
      if: always()
      run: |
        sleep 20
        gh workflow run crypto_scan.yml --ref main || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
