name: Crypto Quant Scan

on:
  schedule:
    - cron: '*/30 * * * *'   # Every 30 minutes
  workflow_dispatch:           # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Test API connectivity
      run: |
        python - <<'PYEOF'
        import requests, json
        tests = [
            ("Bybit klines",    "https://api.bybit.com/v5/market/kline",
             {"category":"spot","symbol":"BTCUSDT","interval":"60","limit":"3"}),
            ("Binance klines",  "https://api.binance.com/api/v3/klines",
             {"symbol":"BTCUSDT","interval":"1h","limit":"3"}),
            ("KuCoin klines",   "https://api.kucoin.com/api/v1/market/candles",
             {"type":"1hour","symbol":"BTC-USDT"}),
            ("CryptoCompare 1h","https://min-api.cryptocompare.com/data/v2/histohour",
             {"fsym":"BTC","tsym":"USDT","limit":"3"}),
        ]
        for name, url, params in tests:
            try:
                r = requests.get(url, params=params, timeout=10,
                                 headers={"User-Agent":"Mozilla/5.0"})
                print(f"{name}: HTTP {r.status_code}  body={r.text[:120]}")
            except Exception as e:
                print(f"{name}: EXCEPTION {e}")
        PYEOF

    - name: Run accuracy tracker cycle
      run: python signal_accuracy_tracker.py --once

    - name: Generate live dashboard
      run: python generate_dashboard.py

    - name: Commit results and dashboard
      run: |
        git config --global user.email "quant-bot@github.com"
        git config --global user.name "Quant Bot"
        git add accuracy_db/ docs/
        git diff --staged --quiet || git commit -m "Scan $(date -u '+%Y-%m-%d %H:%M UTC')"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
