name: Crypto Quant Scan

on:
  schedule:
    - cron: '0 * * * *'    # Safety net: fires hourly if self-trigger chain breaks
  workflow_dispatch:         # Manual trigger from GitHub UI

permissions:
  contents: write
  actions: write             # Needed for self-trigger (workflow_dispatch API)

# Only one scan job at a time — prevents concurrent SQLite writes / DB corruption
concurrency:
  group: crypto-scan-singleton
  cancel-in-progress: false   # Queue rather than cancel; chain stays intact

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 56       # Leave 2 min headroom for self-trigger step

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Configure git
      run: |
        git config --global user.email "quant-bot@github.com"
        git config --global user.name "Quant Bot"

    - name: Run 1-minute scan loop (50 iterations ≈ 50 min)
      run: |
        # One-time prune: remove MONITORING tier noise signals (score < 35)
        python signal_accuracy_tracker.py --prune || true

        for i in $(seq 1 50); do
          echo "=== Scan $i/50 at $(date -u '+%H:%M:%S UTC') ==="
          START_TIME=$(date +%s)

          python signal_accuracy_tracker.py --once

          ELAPSED=$(( $(date +%s) - START_TIME ))
          REMAINING=$(( 60 - ELAPSED ))
          [ $REMAINING -gt 5 ] && sleep $REMAINING

          # Commit + push every 5 scans (~5 min) and on final scan
          if [ $(( i % 5 )) -eq 0 ] || [ $i -eq 50 ]; then
            # Save scan data before resetting to latest remote code
            mkdir -p /tmp/scan_backup
            cp accuracy_db/signals.db        /tmp/scan_backup/ 2>/dev/null || true
            cp accuracy_db/latest_scan.json  /tmp/scan_backup/ 2>/dev/null || true
            cp accuracy_db/perp_arb.json     /tmp/scan_backup/ 2>/dev/null || true
            cp accuracy_db/perp_arb.db       /tmp/scan_backup/ 2>/dev/null || true
            cp accuracy_db/signals_history.json /tmp/scan_backup/ 2>/dev/null || true

            # Hard-reset to latest remote so Python code is always up to date
            # This prevents the runner from reverting code pushes we make from local
            git fetch origin main
            git reset --hard origin/main

            # Restore our fresh scan data on top of the latest code
            cp /tmp/scan_backup/signals.db          accuracy_db/ 2>/dev/null || true
            cp /tmp/scan_backup/latest_scan.json    accuracy_db/ 2>/dev/null || true
            cp /tmp/scan_backup/perp_arb.json       accuracy_db/ 2>/dev/null || true
            cp /tmp/scan_backup/perp_arb.db         accuracy_db/ 2>/dev/null || true
            cp /tmp/scan_backup/signals_history.json accuracy_db/ 2>/dev/null || true

            # Regenerate dashboard with latest code + fresh scan data
            python generate_dashboard.py

            git add accuracy_db/ docs/
            if ! git diff --staged --quiet; then
              git commit -m "Scans up to $(date -u '+%Y-%m-%d %H:%M UTC') [scan $i/50]"
              git push origin HEAD:main
            fi
          fi
        done
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ── SELF-TRIGGER: immediately queue the next run so scanning is continuous ──
    # This ensures data updates every ~50 min regardless of GitHub cron reliability.
    # Concurrency group above guarantees only one job runs at a time (no DB corruption).
    - name: Queue next scan run
      if: always()
      run: |
        sleep 20
        gh workflow run crypto_scan.yml --ref main || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
